
name: Auto-update wallpapers.json

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'wallpapers.json'
      - '.github/**'

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Generate wallpapers.json
        run: |
          BASE_URL="https://raw.githubusercontent.com/sarthakchoyal/tv-wallpapers/main"

          python3 -c '
          import os, json, urllib.parse

          base = "'"$BASE_URL"'"
          exts = (".jpg", ".jpeg", ".png", ".webp")
          items = []

          for f in sorted(os.listdir(".")):
              if f.lower().endswith(exts):
                  title = os.path.splitext(f)[0].replace("-", " ").replace("_", " ")
                  url = f"{base}/{urllib.parse.quote(f)}"
                  items.append({"title": title, "url_img": url})

          with open("wallpapers.json", "w") as out:
              json.dump(items, out, indent=2)
          '

      - name: Commit and push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add wallpapers.json

          if git diff --staged --quiet; then
            echo "No changes to wallpapers.json"
            exit 0
          fi

          git commit -m "Update wallpapers.json"

          git pull --rebase origin main
          git push origin HEAD:main
